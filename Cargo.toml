[workspace]
members = [
  "crates/capability-core",
  "crates/capability-host",
  "crates/codex-app-server-adapter",
  "crates/capability-schema-cli",
  "crates/codex-artifact-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
async-trait = "0.1"
capability-core = { path = "crates/capability-core" }
capability-host = { path = "crates/capability-host" }
codex-app-server-adapter = { path = "crates/codex-app-server-adapter" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.28"
